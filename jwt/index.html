                        'surface-bright': 'var(--surface-bright)',
                        'surface-container-lowest': 'var(--surface-container-lowest)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container': 'var(--surface-container)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'surface-container-highest': 'var(--surface-container-highest)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'inverse-surface': 'var(--inverse-surface)',
                        'inverse-on-surface': 'var(--inverse-on-surface)',
                        outline: 'var(--outline)',
                        'outline-variant': 'var(--outline-variant)',

                        secondary: 'var(--secondary)',

                        'secondary-container': 'var(--secondary-container)',
                        'on-secondary-container': 'var(--on-secondary-container)',
                        tertiary: 'var(--tertiary)',

                        'error-container': 'var(--error-container)',
                        'on-error-container': 'var(--on-error-container)',
                        background: 'var(--background)',
                        'on-background': 'var(--on-background)',
                        'surface-variant': 'var(--surface-variant)',
                    },
                    borderRadius: {
                        DEFAULT: "var(--rounded-base)",

                        xl: "var(--rounded-xl)",
                        full: "9999px",
                    },
                    spacing: {

                        'margin-mobile': "var(--margin-mobile)",

                    fontFamily: {

                        mono: ['var(--font-mono)'],
                    },
                    fontSize: {
                        'h-xl': ["var(--h-xl-size)", {"lineHeight": "var(--h-xl-lh)", "letterSpacing": "var(--h-xl-ls)", "fontWeight": "var(--h-xl-weight)"}],
                        'h-lg': ["var(--h-lg-size)", {"lineHeight": "var(--h-lg-lh)", "fontWeight": "var(--h-lg-weight)"}],
                        'h-md': ["var(--h-md-size)", {"lineHeight": "var(--h-md-lh)", "fontWeight": "var(--h-md-weight)"}],
                        'label-sm': ["var(--label-size)", {"lineHeight": "var(--label-lh)", "letterSpacing": "var(--label-ls)", "fontWeight": "var(--label-weight)"}],

    <link rel="stylesheet" href="../styles/global.css">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
    <div class="grid-bg"></div>
    
    <!-- TopNavBar -->
    <header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin py-4 max-w-container-max mx-auto bg-surface/80 backdrop-blur-md border-b border-outline-variant">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center">
                <img src="../new ui/kitecodelogo.png" alt="Secondary Logo" style="height: 32px; width: auto; object-fit: contain;"/>
            </a>
            <div class="font-h-md text-h-md font-bold text-primary hidden sm:block">DevToolbox</div>
        </div>
        <div class="flex items-center gap-4">
            <button id="theme-toggle" class="material-symbols-outlined text-on-surface scale-95 active:opacity-80 transition-all p-2 rounded-full hover:bg-surface-container">dark_mode</button>
        </div>
    </header>

    <main class="pt-32 pb-24 px-margin-mobile md:px-margin max-w-container-max mx-auto relative z-10">
        <section class="mb-12 max-w-3xl mx-auto">
            <h1 class="font-h-xl text-h-xl mb-4 text-on-background">JWT Decoder</h1>
            <p class="text-h-lg text-on-surface-variant">Decode and inspect JSON Web Tokens (JWT) to view their header, payload, and expiration.</p>
        </section>

        <div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 md:p-8 shadow-sm max-w-3xl mx-auto">
            <div class="space-y-6">
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">JWT Token</label>
                    <textarea id="input" class="w-full bg-surface-container-lowest border border-outline-variant p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary text-on-surface placeholder:text-outline font-mono text-body-md" placeholder="Paste JWT token here..." rows="4" oninput="onInput()"></textarea>
                </div>

                <div id="resultArea" class="space-y-6"></div>
            </div>
        </div>
    </main>

    <footer class="bg-surface py-12 px-8 md:px-margin border-t border-outline-variant">
        <div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-on-surface-variant font-label-sm text-label-sm">© 2024 DEVTOOLBOX SYSTEMATICS</div>
            <div class="flex flex-col items-center gap-2">
                <img src="../kitecode.jpg" alt="Logo" class="h-18 w-auto"/>
                <span class="text-[10px] text-on-surface-variant">By Anshul Datey</span>
            </div>
            <div class="flex gap-8 text-on-surface-variant font-label-sm text-label-sm">
                <a class="hover:text-primary transition-colors" href="#">PRIVACY</a>
                <a class="hover:text-primary transition-colors" href="#">TERMS</a>
                <a class="hover:text-primary transition-colors" href="#">GITHUB</a>
            </div>
        </div>
    </footer>

    <script>
    function sanitize(str) {
        return str
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/javascript:/gi, '')
            .replace(/on\w+=/gi, '');
    }
        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.className = savedTheme;
        updateToggleIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.className;
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.className = newTheme;
            localStorage.setItem('theme', newTheme);
            updateToggleIcon(newTheme);
        });

        function updateToggleIcon(theme) {
            themeToggle.textContent = theme === 'light' ? 'dark_mode' : 'light_mode';
        }

        // JWT Decoder Logic
        const input = document.getElementById('input');
        const resultArea = document.getElementById('resultArea');
        let debounceTimer;

        function onInput() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(decode, 300);
        }

        function base64UrlDecode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            str += '='.repeat((4 - str.length % 4) % 4);
            try {
                return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            } catch {
                return atob(str);
            }
        }

        function decode() {
            const token = input.value.trim();
            if (!token) {
                resultArea.innerHTML = '';
                return;
            }

            const parts = token.split('.');
            if (parts.length !== 3) {
                resultArea.innerHTML = '<div class="p-4 bg-error-container text-on-error-container rounded-lg text-body-md">Invalid JWT format. Expected 3 dot-separated parts.</div>';
                return;
            }

            try {
                const header = JSON.parse(base64UrlDecode(parts[0]));
                const payload = JSON.parse(base64UrlDecode(parts[1]));
                const signature = parts[2];

                resultArea.innerHTML = ''; // Clear previous results

                // Helper to create a card
                function createCard(title, content, isExp = false) {
                    const card = document.createElement('div');
                    card.className = 'bg-surface-container border border-outline-variant rounded-xl p-6 shadow-sm';
                    
                    const h3 = document.createElement('h3');
                    h3.className = 'block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-4';
                    h3.textContent = title;
                    card.appendChild(h3);

                    const pre = document.createElement('pre');
                    pre.className = 'font-mono text-body-md text-on-surface bg-surface-container-lowest p-4 rounded-lg overflow-x-auto';
                    if (title === 'Signature') pre.classList.add('truncate');
                    pre.textContent = content;
                    card.appendChild(pre);

                    if (isExp && payload.exp) {
                        const expDate = new Date(payload.exp * 1000);
                        const p = document.createElement('p');
                        p.className = 'mt-2 font-bold text-body-md';
                        if (expDate < new Date()) {
                            p.classList.add('text-error');
                            p.textContent = `⚠️ Token expired ${expDate.toLocaleString()}`;
                        } else {
                            p.classList.add('text-primary');
                            p.textContent = `✓ Valid until ${expDate.toLocaleString()}`;
                        }
                        card.appendChild(p);
                    }

                    if (title === 'Signature') {
                        const p = document.createElement('p');
                        p.className = 'mt-2 text-on-surface-variant text-body-md italic';
                        p.textContent = '⚠️ Signature not verified (client-side only)';
                        card.appendChild(p);
                    }

                    return card;
                }

                resultArea.appendChild(createCard('Header', JSON.stringify(header, null, 2)));
                resultArea.appendChild(createCard('Payload', JSON.stringify(payload, null, 2), true));
                resultArea.appendChild(createCard('Signature', signature));

            } catch(e) {
                resultArea.innerHTML = '<div class="p-4 bg-error-container text-on-error-container rounded-lg text-body-md">Failed to decode JWT: ' + sanitize(e.message) + '</div>';
            }
        }
    </script>
</body>
</html>
