<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="no-referrer">
    <title>Regex Tester Online — Test Regular Expressions Free</title>
    <meta name="description" content="Write and test regular expressions with live match highlighting. Supports g, i, m, s flags. Free tool.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-dim': 'var(--surface-dim)',
                        'surface-bright': 'var(--surface-bright)',
                        'surface-container-lowest': 'var(--surface-container-lowest)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container': 'var(--surface-container)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'surface-container-highest': 'var(--surface-container-highest)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'inverse-surface': 'var(--inverse-surface)',
                        'inverse-on-surface': 'var(--inverse-on-surface)',
                        outline: 'var(--outline)',
                        'outline-variant': 'var(--outline-variant)',
                        'surface-tint': 'var(--surface-tint)',
                        primary: 'var(--primary)',
                        'on-primary': 'var(--on-primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary-container': 'var(--on-primary-container)',
                        'inverse-primary': 'var(--inverse-primary)',
                        secondary: 'var(--secondary)',
                        'on-secondary': 'var(--on-secondary)',
                        'secondary-container': 'var(--secondary-container)',
                        'on-secondary-container': 'var(--on-secondary-container)',
                        tertiary: 'var(--tertiary)',
                        'on-tertiary': 'var(--on-tertiary)',
                        'tertiary-container': 'var(--tertiary-container)',
                        'on-tertiary-container': 'var(--on-tertiary-container)',
                        error: 'var(--error)',
                        'on-error': 'var(--on-error)',
                        'error-container': 'var(--error-container)',
                        'on-error-container': 'var(--on-error-container)',
                        background: 'var(--background)',
                        'on-background': 'var(--on-background)',
                        'surface-variant': 'var(--surface-variant)',
                    },
                    borderRadius: {
                        DEFAULT: "var(--rounded-base)",
                        lg: "var(--rounded-lg)",
                        xl: "var(--rounded-xl)",
                        full: "9999px",
                    },
                    spacing: {
                        unit: "4px",
                        gutter: "var(--gutter)",
                        margin: "var(--margin)",
                        'margin-mobile': "var(--margin-mobile)",
                        'container-max': "var(--container-max)",
                    },
                    fontFamily: {
                        headline: ['var(--font-headline)'],
                        body: ['var(--font-headline)'],
                        mono: ['var(--font-mono)'],
                    },
                    fontSize: {
                        'h-xl': ["var(--h-xl-size)", {"lineHeight": "var(--h-xl-lh)", "letterSpacing": "var(--h-xl-ls)", "fontWeight": "var(--h-xl-weight)"}],
                        'h-lg': ["var(--h-lg-size)", {"lineHeight": "var(--h-lg-lh)", "fontWeight": "var(--h-lg-weight)"}],
                        'h-md': ["var(--h-md-size)", {"lineHeight": "var(--h-md-lh)", "fontWeight": "var(--h-md-weight)"}],
                        'label-sm': ["var(--label-size)", {"lineHeight": "var(--label-lh)", "letterSpacing": "var(--label-ls)", "fontWeight": "var(--label-weight)"}],
                        'body-md': ["var(--body-size)", {"lineHeight": "var(--body-lh)", "fontWeight": "var(--body-weight)"}],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/global.css">
    <style>
        .highlight-area {
            position: relative;
        }
        .highlight-area textarea {
            position: relative;
            z-index: 2;
            background: transparent !important;
            color: transparent !important;
            caret-color: var(--on-surface);
        }
        .highlight-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: var(--body-size);
            line-height: var(--body-lh);
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
            z-index: 1;
            color: var(--on-surface);
            overflow: hidden;
        }
        .highlight-backdrop mark {
            background: #fde047;
            color: #111;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
    <div class="grid-bg"></div>
    
    <!-- TopNavBar -->
    <header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin py-4 bg-surface/80 backdrop-blur-md border-b border-outline-variant">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center">
                <img src="../new ui/kitecodelogo.png" alt="Secondary Logo" style="height: 52px; width: auto; object-fit: contain;"/>
            </a>
            <div class="font-h-md text-h-md font-bold text-primary hidden sm:block">DevToolbox</div>
        </div>
        <div class="flex items-center gap-4">
            <button id="theme-toggle" class="material-symbols-outlined text-on-surface scale-95 active:opacity-80 transition-all p-2 rounded-full hover:bg-surface-container">dark_mode</button>
        </div>
    </header>

    <main class="pt-32 pb-24 px-margin-mobile md:px-margin max-w-container-max mx-auto relative z-10">
        <section class="mb-12 max-w-3xl mx-auto">
            <h1 class="font-h-xl text-h-xl mb-4 text-on-background">Regex Tester</h1>
            <p class="text-h-lg text-on-surface-variant">Test regular expressions with live match highlighting and grouping.</p>
        </section>

        <div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 md:p-8 shadow-sm max-w-3xl mx-auto">
            <div class="space-y-6">
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Regular Expression</label>
                    <div class="flex items-center bg-surface-container-lowest border border-outline-variant rounded-lg focus-within:ring-1 focus-within:ring-primary overflow-hidden">
                        <span class="px-3 font-mono text-on-surface-variant">/</span>
                        <input type="text" id="pattern" class="flex-1 bg-transparent border-none p-4 focus:ring-0 text-on-surface font-mono text-body-md" placeholder="[a-z]+" oninput="onInput()" spellcheck="false">
                        <span class="px-3 font-mono text-on-surface-variant">/</span>
                    </div>
                    <div class="flex flex-wrap gap-4 mt-3">
                        <label class="flex items-center gap-2 cursor-pointer text-body-md text-on-surface-variant">
                            <input type="checkbox" id="flagG" checked onchange="onInput()" class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest"> 
                            <span class="font-mono">g</span> (global)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-body-md text-on-surface-variant">
                            <input type="checkbox" id="flagI" onchange="onInput()" class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest"> 
                            <span class="font-mono">i</span> (ignore case)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-body-md text-on-surface-variant">
                            <input type="checkbox" id="flagM" onchange="onInput()" class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest"> 
                            <span class="font-mono">m</span> (multiline)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-body-md text-on-surface-variant">
                            <input type="checkbox" id="flagS" onchange="onInput()" class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest"> 
                            <span class="font-mono">s</span> (dotAll)
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Test String</label>
                    <div class="highlight-area">
                        <textarea id="testString" class="w-full bg-surface-container-lowest border border-outline-variant p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary text-on-surface placeholder:text-outline font-mono leading-relaxed text-body-md" placeholder="Enter test string..." rows="6" oninput="onInput()"></textarea>
                        <div class="highlight-backdrop" id="backdrop"></div>
                    </div>
                </div>

                <div id="matchCount" class="hidden p-4 rounded-lg text-body-md font-medium"></div>

                <div id="matchList" class="space-y-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>
        </div>
    </main>

    <footer class="bg-surface py-12 px-8 md:px-margin border-t border-outline-variant">
        <div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-on-surface-variant font-label-sm text-label-sm">© 2024 DEVTOOLBOX SYSTEMATICS</div>
            <div class="flex flex-col items-center gap-2">
                <img src="../kitecode.jpg" alt="Logo" class="h-18 w-auto"/>
                <span class="text-[10px] text-on-surface-variant">By Anshul Datey</span>
            </div>
            <div class="flex gap-8 text-on-surface-variant font-label-sm text-label-sm">
                <a class="hover:text-primary transition-colors" href="#">PRIVACY</a>
                <a class="hover:text-primary transition-colors" href="#">TERMS</a>
                <a class="hover:text-primary transition-colors" href="#">GITHUB</a>
            </div>
        </div>
    </footer>

    <script>
    function sanitize(str) {
        return str
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/javascript:/gi, '')
            .replace(/on\w+=/gi, '');
    }
        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.className = savedTheme;
        updateToggleIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.className;
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.className = newTheme;
            localStorage.setItem('theme', newTheme);
            updateToggleIcon(newTheme);
        });

        function updateToggleIcon(theme) {
            themeToggle.textContent = theme === 'light' ? 'dark_mode' : 'light_mode';
        }

        // Regex Logic
        const pattern = document.getElementById('pattern');
        const testString = document.getElementById('testString');
        const backdrop = document.getElementById('backdrop');
        const matchCount = document.getElementById('matchCount');
        const matchList = document.getElementById('matchList');
        let debounceTimer;

        function onInput() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(test, 200);
        }

        function test() {
            const pat = pattern.value;
            const text = testString.value;
            if (!pat || !text) {
                backdrop.innerHTML = escapeHtml(text);
                matchCount.classList.add('hidden');
                matchList.innerHTML = '';
                return;
            }

            let flags = '';
            if (document.getElementById('flagG').checked) flags += 'g';
            if (document.getElementById('flagI').checked) flags += 'i';
            if (document.getElementById('flagM').checked) flags += 'm';
            if (document.getElementById('flagS').checked) flags += 's';

            try {
                const re = new RegExp(pat, flags);
                const matches = [...text.matchAll(re)];

                if (matches.length === 0) {
                    backdrop.innerHTML = escapeHtml(text);
                    matchCount.textContent = 'No matches';
                    matchCount.className = 'p-4 rounded-lg text-body-md font-medium bg-error-container text-on-error-container block';
                    matchList.innerHTML = '';
                    return;
                }

                let highlighted = '';
                let lastIndex = 0;
                const items = [];

                matches.forEach((m, i) => {
                    if (m.index > lastIndex) {
                        highlighted += escapeHtml(text.substring(lastIndex, m.index));
                    }
                    highlighted += `<mark>${escapeHtml(m[0])}</mark>`;
                    lastIndex = m.index + m[0].length;
                    items.push(`
                        <div class="p-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-mono text-body-md text-on-surface flex justify-between">
                            <span class="text-primary font-bold">#${i + 1}</span>
                            <span class="opacity-70">[pos: ${m.index}]</span>
                            <span class="truncate ml-4 flex-1 text-right">"${escapeHtml(m[0].substring(0, 50))}"</span>
                        </div>
                    `);
                });

                if (lastIndex < text.length) {
                    highlighted += escapeHtml(text.substring(lastIndex));
                }

                backdrop.innerHTML = highlighted;
                matchCount.textContent = `${matches.length} match${matches.length !== 1 ? 'es' : ''} found`;
                matchCount.className = 'p-4 rounded-lg text-body-md font-medium bg-primary-container text-on-primary-container block';
                matchList.innerHTML = items.join('');
            } catch(e) {
                backdrop.innerHTML = escapeHtml(text);
                matchCount.textContent = 'Error: ' + e.message;
                matchCount.className = 'p-4 rounded-lg text-body-md font-medium bg-error-container text-on-error-container block';
                matchList.innerHTML = '';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        test();
    </script>
</body>
</html>
