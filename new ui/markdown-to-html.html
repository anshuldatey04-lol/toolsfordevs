<script>
// Theme Toggle
const themeToggle = document.getElementById('theme-toggle');
const html = document.documentElement;

const savedTheme = localStorage.getItem('theme') || 'light';
html.className = savedTheme;
themeToggle.textContent = savedTheme === 'light' ? 'dark_mode' : 'light_mode';

themeToggle.addEventListener('click', () => {
    const current = html.className;
    const next = current === 'light' ? 'dark' : 'light';
    html.className = next;
    localStorage.setItem('theme', next);
    themeToggle.textContent = next === 'light' ? 'dark_mode' : 'light_mode';
});

// Header shadow on scroll
window.addEventListener('scroll', () => {
    const header = document.querySelector('header');
    if (window.scrollY > 20) {
        header.classList.add('shadow-md');
    } else {
        header.classList.remove('shadow-md');
    }
});

// Markdown to HTML Converter
function parseInline(text) {
    text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    text = text.replace(/`([^`]+)`/g, '<code class="bg-surface-container-highest px-1 rounded text-sm font-mono">$1</code>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-primary underline">$1</a>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return text;
}

function simpleMarkdown(md) {
    let html = '';
    const lines = md.split('\n');
    let inList = false;

    for (let line of lines) {
        if (/^### /.test(line)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<h3 class="text-h-md font-bold mt-4 mb-2">' + parseInline(line.slice(4)) + '</h3>';
        } else if (/^## /.test(line)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<h2 class="text-h-lg font-bold mt-6 mb-2">' + parseInline(line.slice(3)) + '</h2>';
        } else if (/^# /.test(line)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<h1 class="text-h-xl font-bold mt-8 mb-4">' + parseInline(line.slice(2)) + '</h1>';
        } else if (/^- /.test(line)) {
            if (!inList) { html += '<ul class="list-disc pl-6 space-y-1 mb-4">'; inList = true; }
            html += '<li>' + parseInline(line.slice(2)) + '</li>';
        } else if (line.trim() === '') {
            if (inList) { html += '</ul>'; inList = false; }
        } else {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<p class="mb-3">' + parseInline(line) + '</p>';
        }
    }
    if (inList) html += '</ul>';
    return html;
}

const mdInput = document.getElementById('md-input');
const mdOutput = document.getElementById('md-output');
const mdConvert = document.getElementById('md-convert-btn');
const mdCopy = document.getElementById('md-copy-btn');

mdConvert.addEventListener('click', () => {
    const md = mdInput.value;
    mdOutput.innerHTML = simpleMarkdown(md);
});

mdCopy.addEventListener('click', () => {
    const htmlText = mdOutput.innerHTML;
    navigator.clipboard.writeText(htmlText).then(() => {
        const orig = mdCopy.textContent;
        mdCopy.textContent = 'Copied!';
        setTimeout(() => { mdCopy.textContent = orig; }, 2000);
    });
});

// Initial render
mdConvert.dispatchEvent(new Event('click'));
</script>
