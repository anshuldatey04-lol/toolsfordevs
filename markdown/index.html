<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="no-referrer">
    <title>Markdown to HTML - DevToolbox</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-dim': 'var(--surface-dim)',
                        'surface-bright': 'var(--surface-bright)',
                        'surface-container-lowest': 'var(--surface-container-lowest)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container': 'var(--surface-container)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'surface-container-highest': 'var(--surface-container-highest)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'inverse-surface': 'var(--inverse-surface)',
                        'inverse-on-surface': 'var(--inverse-on-surface)',
                        outline: 'var(--outline)',
                        'outline-variant': 'var(--outline-variant)',
                        'surface-tint': 'var(--surface-tint)',
                        primary: 'var(--primary)',
                        'on-primary': 'var(--on-primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary-container': 'var(--on-primary-container)',
                        'inverse-primary': 'var(--inverse-primary)',
                        secondary: 'var(--secondary)',
                        'on-secondary': 'var(--on-secondary)',
                        'secondary-container': 'var(--secondary-container)',
                        'on-secondary-container': 'var(--on-secondary-container)',
                        tertiary: 'var(--tertiary)',
                        'on-tertiary': 'var(--on-tertiary)',
                        'tertiary-container': 'var(--tertiary-container)',
                        'on-tertiary-container': 'var(--on-tertiary-container)',
                        error: 'var(--error)',
                        'on-error': 'var(--on-error)',
                        'error-container': 'var(--error-container)',
                        'on-error-container': 'var(--on-error-container)',
                        background: 'var(--background)',
                        'on-background': 'var(--on-background)',
                        'surface-variant': 'var(--surface-variant)',
                    },
                    borderRadius: {
                        DEFAULT: "var(--rounded-base)",
                        lg: "var(--rounded-lg)",
                        xl: "var(--rounded-xl)",
                        full: "9999px",
                    },
                    spacing: {
                        unit: "4px",
                        gutter: "var(--gutter)",
                        margin: "var(--margin)",
                        'margin-mobile': "var(--margin-mobile)",
                        'container-max': "var(--container-max)",
                    },
                    fontFamily: {
                        headline: ['var(--font-headline)'],
                        body: ['var(--font-headline)'],
                        mono: ['var(--font-mono)'],
                    },
                    fontSize: {
                        'h-xl': ["var(--h-xl-size)", {"lineHeight": "var(--h-xl-lh)", "letterSpacing": "var(--h-xl-ls)", "fontWeight": "var(--h-xl-weight)"}],
                        'h-lg': ["var(--h-lg-size)", {"lineHeight": "var(--h-lg-lh)", "fontWeight": "var(--h-lg-weight)"}],
                        'h-md': ["var(--h-md-size)", {"lineHeight": "var(--h-md-lh)", "fontWeight": "var(--h-md-weight)"}],
                        'label-sm': ["var(--label-size)", {"lineHeight": "var(--label-lh)", "letterSpacing": "var(--label-ls)", "fontWeight": "var(--label-weight)"}],
                        'body-md': ["var(--body-size)", {"lineHeight": "var(--body-lh)", "fontWeight": "var(--body-weight)"}],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/global.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <style>
        .preview-pane {
            font-size: 14px;
            line-height: 1.6;
        }
        .preview-pane h1 { font-size: 2em; font-weight: bold; margin: 1em 0 0.5em; border-bottom: 1px solid var(--outline-variant); padding-bottom: 0.3em; }
        .preview-pane h2 { font-size: 1.5em; font-weight: bold; margin: 1em 0 0.5em; border-bottom: 1px solid var(--outline-variant); padding-bottom: 0.3em; }
        .preview-pane h3 { font-size: 1.25em; font-weight: bold; margin: 1em 0 0.5em; }
        .preview-pane p { margin-bottom: 1em; }
        .preview-pane ul { list-style-type: disc; padding-left: 2em; margin-bottom: 1em; }
        .preview-pane ol { list-style-type: decimal; padding-left: 2em; margin-bottom: 1em; }
        .preview-pane code { background: var(--surface-container-high); padding: 0.2em 0.4em; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9em; }
        .preview-pane pre { background: var(--surface-container-high); padding: 1em; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; }
        .preview-pane pre code { background: transparent; padding: 0; }
        .preview-pane blockquote { border-left: 4px solid var(--outline-variant); padding-left: 1em; color: var(--on-surface-variant); font-style: italic; margin-bottom: 1em; }
        .preview-pane table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
        .preview-pane th, .preview-pane td { border: 1px solid var(--outline-variant); padding: 0.5em; text-align: left; }
        .preview-pane th { background: var(--surface-container-low); font-weight: bold; }
        .preview-pane img { max-width: 100%; height: auto; }
        .preview-pane hr { border: none; border-top: 1px solid var(--outline-variant); margin: 2em 0; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
    <div class="grid-bg"></div>
    
    <!-- TopNavBar -->
    <header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin py-4 bg-surface/80 backdrop-blur-md border-b border-outline-variant">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center">
                <img src="../new ui/kitecodelogo.png" alt="Secondary Logo" style="height: 52px; width: auto; object-fit: contain;"/>
            </a>
            <div class="font-h-md text-h-md font-bold text-primary hidden sm:block">DevToolbox</div>
        </div>
        <div class="flex items-center gap-4">
            <button id="theme-toggle" class="material-symbols-outlined text-on-surface scale-95 active:opacity-80 transition-all p-2 rounded-full hover:bg-surface-container">dark_mode</button>
        </div>
    </header>

    <main class="pt-32 pb-24 px-margin-mobile md:px-margin max-w-container-max mx-auto relative z-10">
        <section class="mb-12">
            <h1 class="font-h-xl text-h-xl mb-4 text-on-background">Markdown to HTML</h1>
            <p class="text-h-lg text-on-surface-variant">Convert Markdown text into clean, valid HTML with real-time preview.</p>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 shadow-sm">
                <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-4">Markdown Input</label>
                <textarea id="markdown-input" class="w-full h-[600px] bg-surface-container-lowest border border-outline-variant p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary text-on-surface placeholder:text-outline font-mono text-body-md" placeholder="Type markdown here..."># Hello World

This is **bold** and *italic* text.

- List item 1
- List item 2

```js
console.log('hello');
```
</textarea>
            </div>

            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 shadow-sm flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Preview</label>
                    <div class="flex gap-2">
                        <button id="previewBtn" class="bg-primary text-on-primary px-4 py-1 rounded-lg text-label-sm font-bold hover:opacity-90 transition-all" onclick="showPreview()">Preview</button>
                        <button id="sourceBtn" class="bg-surface-container-high text-on-surface px-4 py-1 rounded-lg text-label-sm font-bold hover:bg-surface-container-highest transition-all" onclick="showSource()">HTML Source</button>
                    </div>
                </div>
                
                <div id="preview-pane" class="preview-pane flex-1 bg-surface-container-lowest border border-outline-variant p-6 rounded-lg overflow-y-auto h-[600px] text-on-surface"></div>
                <textarea id="source-pane" class="hidden flex-1 w-full h-[600px] bg-surface-container-lowest border border-outline-variant p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary text-on-surface font-mono text-body-md" readonly></textarea>
            </div>
        </div>
    </main>

    <footer class="bg-surface py-12 px-8 md:px-margin border-t border-outline-variant">
        <div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-on-surface-variant font-label-sm text-label-sm">© 2024 DEVTOOLBOX SYSTEMATICS</div>
            <div class="flex flex-col items-center gap-2">
                <img src="../kitecode.jpg" alt="Logo" class="h-18 w-auto"/>
                <span class="text-[10px] text-on-surface-variant">By Anshul Datey</span>
            </div>
            <div class="flex gap-8 text-on-surface-variant font-label-sm text-label-sm">
                <a class="hover:text-primary transition-colors" href="#">PRIVACY</a>
                <a class="hover:text-primary transition-colors" href="#">TERMS</a>
                <a class="hover:text-primary transition-colors" href="#">GITHUB</a>
            </div>
        </div>
    </footer>

    <script>
    function sanitize(str) {
        return str
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/javascript:/gi, '')
            .replace(/on\w+=/gi, '');
    }
        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.className = savedTheme;
        updateToggleIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.className;
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.className = newTheme;
            localStorage.setItem('theme', newTheme);
            updateToggleIcon(newTheme);
        });

        function updateToggleIcon(theme) {
            themeToggle.textContent = theme === 'light' ? 'dark_mode' : 'light_mode';
        }

        // Markdown Logic
        const mdInput = document.getElementById('markdown-input');
        const previewPane = document.getElementById('preview-pane');
        const sourcePane = document.getElementById('source-pane');
        const previewBtn = document.getElementById('previewBtn');
        const sourceBtn = document.getElementById('sourceBtn');

        marked.use({ 
            mangle: false,
            headerIds: false,
            sanitize: false
        });

        function render() {
            const input = mdInput.value;
            let renderedHtml = marked.parse(input);
            
            // Security hardening: strip scripts and event handlers
            renderedHtml = renderedHtml.replace(/<script[\s\S]*?<\/script>/gi, '');
            renderedHtml = renderedHtml.replace(/on\w+="[^"]*"/gi, '');
            renderedHtml = renderedHtml.replace(/on\w+='[^']*'/gi, '');
            
            previewPane.innerHTML = renderedHtml;
            sourcePane.value = renderedHtml;
        }

        function showPreview() {
            previewPane.classList.remove('hidden');
            sourcePane.classList.add('hidden');
            previewBtn.className = 'bg-primary text-on-primary px-4 py-1 rounded-lg text-label-sm font-bold hover:opacity-90 transition-all';
            sourceBtn.className = 'bg-surface-container-high text-on-surface px-4 py-1 rounded-lg text-label-sm font-bold hover:bg-surface-container-highest transition-all';
        }

        function showSource() {
            previewPane.classList.add('hidden');
            sourcePane.classList.remove('hidden');
            sourceBtn.className = 'bg-primary text-on-primary px-4 py-1 rounded-lg text-label-sm font-bold hover:opacity-90 transition-all';
            previewBtn.className = 'bg-surface-container-high text-on-surface px-4 py-1 rounded-lg text-label-sm font-bold hover:bg-surface-container-highest transition-all';
        }

        mdInput.addEventListener('input', () => {
            clearTimeout(window._mdTimer);
            window._mdTimer = setTimeout(render, 300);
        });

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
