<!DOCTYPE html>
<html class="light" lang="en">
<head>

    <script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-dim': 'var(--surface-dim)',
                        'surface-bright': 'var(--surface-bright)',
                        'surface-container-lowest': 'var(--surface-container-lowest)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container': 'var(--surface-container)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'surface-container-highest': 'var(--surface-container-highest)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'inverse-surface': 'var(--inverse-surface)',
                        'inverse-on-surface': 'var(--inverse-on-surface)',
                        outline: 'var(--outline)',
                        'outline-variant': 'var(--outline-variant)',
                        'surface-tint': 'var(--surface-tint)',
                        primary: 'var(--primary)',
                        'on-primary': 'var(--on-primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary-container': 'var(--on-primary-container)',
                        'inverse-primary': 'var(--inverse-primary)',
                        secondary: 'var(--secondary)',
                        'on-secondary': 'var(--on-secondary)',
                        'secondary-container': 'var(--secondary-container)',
                        'on-secondary-container': 'var(--on-secondary-container)',
                        tertiary: 'var(--tertiary)',
                        'on-tertiary': 'var(--on-tertiary)',
                        'tertiary-container': 'var(--tertiary-container)',
                        'on-tertiary-container': 'var(--on-tertiary-container)',
                        error: 'var(--error)',
                        'on-error': 'var(--on-error)',
                        'error-container': 'var(--error-container)',
                        'on-error-container': 'var(--on-error-container)',
                        background: 'var(--background)',
                        'on-background': 'var(--on-background)',
                        'surface-variant': 'var(--surface-variant)',
                    },
                    borderRadius: {
                        DEFAULT: "var(--rounded-base)",
                        lg: "var(--rounded-lg)",
                        xl: "var(--rounded-xl)",
                        full: "9999px",
                    },
                    spacing: {
                        unit: "4px",
                        gutter: "var(--gutter)",
                        margin: "var(--margin)",
                        'margin-mobile': "var(--margin-mobile)",
                        'container-max': "var(--container-max)",
                    },
                    fontFamily: {
                        headline: ['var(--font-headline)'],
                        body: ['var(--font-headline)'],
                        mono: ['var(--font-mono)'],
                    },
                    fontSize: {
                        'h-xl': ["var(--h-xl-size)", {"lineHeight": "var(--h-xl-lh)", "letterSpacing": "var(--h-xl-ls)", "fontWeight": "var(--h-xl-weight)"}],
                        'h-lg': ["var(--h-lg-size)", {"lineHeight": "var(--h-lg-lh)", "fontWeight": "var(--h-lg-weight)"}],
                        'h-md': ["var(--h-md-size)", {"lineHeight": "var(--h-md-lh)", "fontWeight": "var(--h-md-weight)"}],
                        'label-sm': ["var(--label-size)", {"lineHeight": "var(--label-lh)", "letterSpacing": "var(--label-ls)", "fontWeight": "var(--label-weight)"}],
                        'body-md': ["var(--body-size)", {"lineHeight": "var(--body-lh)", "fontWeight": "var(--body-weight)"}],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/global.css">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
    <div class="grid-bg"></div>
    
    <!-- TopNavBar -->
    <header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin py-4 max-w-container-max mx-auto bg-surface/80 backdrop-blur-md border-b border-outline-variant">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center">
                <img src="../new ui/kitecodelogo.png" alt="Secondary Logo" style="height: 52px; width: auto; object-fit: contain;"/>
            </a>
            <div class="font-h-md text-h-md font-bold text-primary hidden sm:block">DevToolbox</div>
        </div>
        <div class="flex items-center gap-4">
            <button id="theme-toggle" class="material-symbols-outlined text-on-surface scale-95 active:opacity-80 transition-all p-2 rounded-full hover:bg-surface-container">dark_mode</button>
        </div>
    </header>

    <main class="pt-32 pb-24 px-margin-mobile md:px-margin max-w-container-max mx-auto relative z-10">
        <section class="mb-12 max-w-3xl mx-auto">
            <h1 class="font-h-xl text-h-xl mb-4 text-on-background">Timestamp Converter</h1>
            <p class="text-h-lg text-on-surface-variant">Convert Unix timestamps to readable dates and vice-versa with ease.</p>
        </section>

        <div class="grid gap-8 max-w-3xl mx-auto">
            <!-- Unix to Date -->
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 md:p-8 shadow-sm">
                <h2 class="font-h-md text-h-md mb-6 text-on-background">Unix → Date</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Unix Timestamp</label>
                        <input type="text" id="timestampInput" class="w-full bg-surface-container-lowest border border-outline-variant p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary text-on-surface font-mono text-body-md" placeholder="e.g. 1700000000">
                    </div>

                    <div class="flex flex-wrap gap-4">
                        <button class="bg-primary text-on-primary px-6 py-2 rounded-lg font-bold hover:opacity-90 transition-all text-body-md" onclick="unixToDate()">Convert →</button>
                        <button class="bg-surface-container-high text-on-surface px-6 py-2 rounded-lg font-bold hover:bg-surface-container-highest transition-all text-body-md" onclick="useNow()">Use Current Time</button>
                    </div>

                    <div id="unixResult" class="space-y-3 pt-4 border-t border-outline-variant">
                        <div class="flex justify-between items-center p-3 bg-surface-container-lowest rounded-lg border border-outline-variant">
                            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Local</span>
                            <span id="localDate" class="font-mono text-on-surface text-body-md">—</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-surface-container-lowest rounded-lg border border-outline-variant">
                            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">UTC</span>
                            <span id="utcDate" class="font-mono text-on-surface text-body-md">—</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-surface-container-lowest rounded-lg border border-outline-variant">
                            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Relative</span>
                            <span id="relativeTime" class="font-mono text-on-surface text-body-md">—</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Date to Unix -->
            <div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 md:p-8 shadow-sm">
                <h2 class="font-h-md text-h-md mb-6 text-on-background">Date → Unix</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Date & Time</label>
                        <input type="datetime-local" id="dateInput" class="w-full bg-surface-container-lowest border border-outline-variant p-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary text-on-surface text-body-md">
                    </div>

                    <div class="flex flex-wrap gap-4">
                        <button class="bg-primary text-on-primary px-6 py-2 rounded-lg font-bold hover:opacity-90 transition-all text-body-md" onclick="dateToUnix()">Convert →</button>
                    </div>

                    <div id="dateResult" class="space-y-3 pt-4 border-t border-outline-variant">
                        <div class="flex justify-between items-center p-3 bg-surface-container-lowest rounded-lg border border-outline-variant">
                            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Seconds</span>
                            <span id="seconds" class="font-mono text-on-surface text-body-md">—</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-surface-container-lowest rounded-lg border border-outline-variant">
                            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Milliseconds</span>
                            <span id="milliseconds" class="font-mono text-on-surface text-body-md">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-surface py-12 px-8 md:px-margin border-t border-outline-variant">
        <div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-on-surface-variant font-label-sm text-label-sm">© 2024 DEVTOOLBOX SYSTEMATICS</div>
            <div class="flex flex-col items-center gap-2">
                <img src="../kitecode.jpg" alt="Logo" class="h-18 w-auto"/>
                <span class="text-[10px] text-on-surface-variant">By Anshul Datey</span>
            </div>
            <div class="flex gap-8 text-on-surface-variant font-label-sm text-label-sm">
                <a class="hover:text-primary transition-colors" href="#">PRIVACY</a>
                <a class="hover:text-primary transition-colors" href="#">TERMS</a>
                <a class="hover:text-primary transition-colors" href="#">GITHUB</a>
            </div>
        </div>
    </footer>

    <script>
    function sanitize(str) {
        return str
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/javascript:/gi, '')
            .replace(/on\w+=/gi, '');
    }
        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.className = savedTheme;
        updateToggleIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.className;
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.className = newTheme;
            localStorage.setItem('theme', newTheme);
            updateToggleIcon(newTheme);
        });

        function updateToggleIcon(theme) {
            themeToggle.textContent = theme === 'light' ? 'dark_mode' : 'light_mode';
        }

        // Timestamp Logic
        function unixToDate() {
            const val = document.getElementById('timestampInput').value.trim();
            if (!val) return;
            const ts = parseInt(val);
            if (isNaN(ts)) return;
            const d = new Date(ts * 1000);
            document.getElementById('localDate').textContent = d.toLocaleString();
            document.getElementById('utcDate').textContent = d.toUTCString();
            const now = Date.now();
            const diff = now - ts * 1000;
            const seconds = Math.floor(diff / 1000);
            let relative;
            if (seconds < 0) relative = 'in the future';
            else if (seconds < 60) relative = 'just now';
            else if (seconds < 3600) relative = Math.floor(seconds / 60) + ' minutes ago';
            else if (seconds < 86400) relative = Math.floor(seconds / 3600) + ' hours ago';
            else relative = Math.floor(seconds / 86400) + ' days ago';
            document.getElementById('relativeTime').textContent = relative;
        }

        function dateToUnix() {
            const val = document.getElementById('dateInput').value;
            if (!val) return;
            const d = new Date(val);
            document.getElementById('seconds').textContent = Math.floor(d.getTime() / 1000);
            document.getElementById('milliseconds').textContent = d.getTime();
        }

        function useNow() {
            const now = Math.floor(Date.now() / 1000);
            document.getElementById('timestampInput').value = now;
            unixToDate();
            const d = new Date();
            const pad = n => n.toString().padStart(2, '0');
            document.getElementById('dateInput').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            dateToUnix();
        }
    </script>
</body>
</html>
